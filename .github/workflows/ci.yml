name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Build & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: TypeScript Compile & Build
        run: npm --prefix backend run build

      - name: Run Backend Automated Tests
        run: npm --prefix backend test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_minimum_32_characters_long
          AWS_REGION: us-east-1
          AWS_S3_BUCKET: test-bucket
          AWS_ACCESS_KEY_ID: mock_test_key
          AWS_SECRET_ACCESS_KEY: mock_test_secret

  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Frontend Typecheck & Build
        run: npm --prefix frontend run build

  docker-verification:
    name: Docker Configuration & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build
